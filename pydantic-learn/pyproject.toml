[project]
name = "pydantic-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "koushikwebdev", email = "kou.saha.ami@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
pydantic-learn = "pydantic_learn:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
